name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]   # 3.12 is what the Azure Function runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests azure demo
      - name: Tests (offline: synthetic data, SQLite, fake Azure OpenAI)
        run: pytest
      - name: Demo audit runs end to end
        run: |
          python demo/make_demo.py
          modelaudit run --prices demo/data/prices.csv --positions demo/data/positions_honest_momentum.csv \
            --gates demo/gates.json --name honest_momentum --out ci-report
          test -s ci-report/report.html

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
