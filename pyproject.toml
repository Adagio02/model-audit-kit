[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelaudit"
version = "0.2.0"
description = "Independent backtest validation: leakage, costs, walk-forward, overfitting, risk and a gate verdict."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6"]
# Azure mode: Blob Storage, Azure SQL (mssql-python), Microsoft Foundry / Azure OpenAI
azure = ["azure-identity>=1.17", "azure-storage-blob>=12.20", "mssql-python>=1.0", "openai>=1.60"]

[project.scripts]
modelaudit = "modelaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --basetemp=pytest-temp"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Pinned so a new Ruff release cannot change what CI enforces: errors, undefined names, unused imports,
# and invalid escape sequences.
select = ["E4", "E7", "E9", "F", "W605"]

[tool.ruff.lint.per-file-ignores]
# Fabric notebook cells: imports sit in the cell that first needs them, by design.
"azure/fabric/audit_notebook.py" = ["E402"]
